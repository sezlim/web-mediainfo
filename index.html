<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 MediaInfo (대용량 폴더 지원 API)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f5f5f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .control-panel { margin: 20px 0; padding: 15px; background: #eef2f5; border-radius: 6px; }
        button.custom-file-upload { display: inline-block; padding: 10px 20px; cursor: pointer; background-color: #007acc; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        button.custom-file-upload:hover { background-color: #005999; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .status { color: #e67e22; font-weight: bold; margin-top: 15px; }
        .progress-bar { width: 100%; height: 20px; background-color: #ddd; border-radius: 10px; margin-top: 10px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background-color: #27ae60; width: 0%; transition: width 0.3s ease; }
        
        .layout { display: flex; gap: 20px; margin-top: 20px; }
        .file-list-section, .log-section { flex: 1; display: flex; flex-direction: column; }
        
        .box-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .scroll-box { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-y: auto; height: 300px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
        
        #download-btn { display: none; margin-top: 20px; padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        #download-btn:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h2>📁 웹 MediaInfo 대용량 폴더 분석기</h2>
    <div class="control-panel">
        <!-- input 태그 대신 button과 showDirectoryPicker API 사용 -->
        <button id="folder-btn" class="custom-file-upload">대용량 루트 폴더 선택하기</button>
        
        <div id="status-msg" class="status">대기 중... 폴더를 선택해주세요. (스캔 중 브라우저가 멈추지 않습니다)</div>
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="layout">
        <div class="file-list-section">
            <div class="box-title">감지된 미디어 파일 리스트 (비동기 스캔)</div>
            <div class="scroll-box" id="file-list-output"></div>
        </div>
        <div class="log-section">
            <div class="box-title">실시간 분석 로그</div>
            <div class="scroll-box" id="log-output"></div>
        </div>
    </div>

    <button id="download-btn">📥 전체 분석 리포트 다운로드 (.txt)</button>
</div>

<script type="module">
    import mediainfoJs from 'https://cdn.jsdelivr.net/npm/mediainfo.js@0.3.1/+esm';

    const folderBtn = document.getElementById('folder-btn');
    const fileListOutput = document.getElementById('file-list-output');
    const logOutput = document.getElementById('log-output');
    const statusMsg = document.getElementById('status-msg');
    const downloadBtn = document.getElementById('download-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');

    const validExtensions = /\.(mp4|mov|mxf|avi|mkv|wav|mp3|m4a|aac|ts|m2ts|aaf)$/i;
    let mediaFiles = [];

    // 1. 비동기 폴더 재귀 탐색 함수 (UI 스레드 멈춤 방지)
    async function scanDirectory(dirHandle, path = '') {
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file') {
                if (entry.name.match(validExtensions)) {
                    const file = await entry.getFile();
                    file.customPath = path + entry.name;
                    mediaFiles.push(file);
                    
                    // 스캔되는 즉시 화면에 리스트 업데이트
                    fileListOutput.textContent += file.customPath + '\n';
                    fileListOutput.scrollTop = fileListOutput.scrollHeight;
                }
            } else if (entry.kind === 'directory') {
                // 재귀 호출
                await scanDirectory(entry, path + entry.name + '/');
            }
        }
    }

    folderBtn.addEventListener('click', async () => {
        try {
            // 최신 File System API 호출 (브라우저 자체 폴더 선택창 팝업)
            const dirHandle = await window.showDirectoryPicker();
            
            // 초기화
            mediaFiles = [];
            fileListOutput.textContent = "";
            logOutput.textContent = "폴더 구조 스캔 중...\n";
            downloadBtn.style.display = "none";
            folderBtn.disabled = true;
            statusMsg.textContent = "폴더 구조 스캔 중... (파일 개수에 따라 시간이 소요됩니다)";

            // 폴더 비동기 스캔 시작
            await scanDirectory(dirHandle);

            if (mediaFiles.length === 0) {
                statusMsg.textContent = "선택한 경로에 분석할 미디어 파일이 없습니다.";
                folderBtn.disabled = false;
                return;
            }

            // 분석 시작
            statusMsg.textContent = `총 ${mediaFiles.length}개의 미디어 파일 스캔 완료. 분석을 시작합니다.`;
            progressBar.style.display = "block";
            let combinedReport = `===== MediaInfo Batch Report =====\n생성 시간: ${new Date().toLocaleString()}\n총 파일 수: ${mediaFiles.length}개\n==================================\n\n`;

            for (let i = 0; i < mediaFiles.length; i++) {
                const file = mediaFiles[i];
                const currentCount = i + 1;
                
                progressFill.style.width = `${(currentCount / mediaFiles.length) * 100}%`;
                statusMsg.textContent = `분석 중... (${currentCount} / ${mediaFiles.length}) : ${file.name}`;
                
                try {
                    const result = await processSingleFile(file);
                    
                    combinedReport += `------------------------------------------------------------\n`;
                    combinedReport += `📁 File: ${file.customPath}\n`;
                    combinedReport += `------------------------------------------------------------\n`;
                    combinedReport += result + `\n\n`;

                    logOutput.textContent += `[완료] ${file.name}\n`;
                    logOutput.scrollTop = logOutput.scrollHeight;
                } catch (error) {
                    logOutput.textContent += `[에러] ${file.name} - ${error.message}\n`;
                    combinedReport += `[분석 실패] ${file.customPath}\n\n`;
                }
            }

            statusMsg.textContent = `✅ 총 ${mediaFiles.length}개 파일 분석 완료!`;
            logOutput.textContent += `\n모든 작업이 완료되었습니다.`;
            folderBtn.disabled = false;
            
            setupDownload(combinedReport);

        } catch (error) {
            // 사용자가 폴더 선택 창을 취소한 경우 예외 처리
            console.error("폴더 선택 취소 또는 에러:", error);
            statusMsg.textContent = "폴더 선택이 취소되었거나 권한이 없습니다.";
            folderBtn.disabled = false;
        }
    });

    async function processSingleFile(file) {
        const mediainfo = await mediainfoJs({
            format: 'text',
            locateFile: () => 'https://cdn.jsdelivr.net/npm/mediainfo.js@0.3.1/dist/MediaInfoModule.wasm'
        });

        const getSize = () => file.size;
        const readChunk = (chunkSize, offset) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (e.target.error) reject(e.target.error);
                    else resolve(new Uint8Array(e.target.result));
                };
                reader.readAsArrayBuffer(file.slice(offset, offset + chunkSize));
            });
        };

        const result = await mediainfo.analyzeData(getSize, readChunk);
        mediainfo.close(); 
        return result;
    }

    function setupDownload(textData) {
        const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        downloadBtn.style.display = "block";
        downloadBtn.onclick = () => {
            const a = document.createElement('a');
            a.href = url;
            a.download = `MediaInfo_Report_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    }
</script>

</body>
</html>
